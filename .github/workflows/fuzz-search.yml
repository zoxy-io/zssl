name: fuzz-search

# The coverage-guided search, nightly — zoxy's `nightly-sim.yml` shape,
# for the same reason: a search has no natural end, so it belongs on a
# clock rather than in a pull request. `fuzz.yml` is the per-PR gate and
# runs each target once over its seeds; this one lets the fuzzer *steer*.
#
# The corpus is cached between runs and that is the whole point. A
# coverage-guided fuzzer is worth what its corpus is worth, and a run
# that starts from the three inline seeds each morning is a random
# search wearing a fuzzer's name.
on:
  schedule:
    # 04:00 UTC daily, an hour after zoxy's sim so two long jobs do not
    # contend for the same runners.
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long to search"
        required: false
        default: "20"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/zig

      # Restored by prefix so yesterday's corpus seeds today's run; saved
      # under a unique key because the cache is immutable once written.
      - name: restore the corpus
        uses: actions/cache/restore@v4
        with:
          path: .zig-cache/f
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-

      - name: search
        id: search
        env:
          MINUTES: ${{ inputs.minutes || '20' }}
        # Not the default `bash -e`. This step's whole job is to inspect a
        # non-zero status and decide what it means, and `-e` denies it the
        # chance: with `pipefail` on, the timeout's 124 becomes the
        # pipeline's status and `-e` kills the script on that very line —
        # before `PIPESTATUS` is read, before the `if` below forgives it.
        # Every run of this workflow failed that way while the comment
        # underneath correctly called 124 the expected outcome. `set` in
        # the body cannot fix it, because the flag arrives on the command
        # line, so it has to be spelled out here.
        shell: bash --noprofile --norc -uo pipefail {0}
        run: |
          # `--fuzz` runs until interrupted, so the time box is the
          # runner's. 124 is the timeout firing, which is the *expected*
          # end of a search; anything else is the fuzzer stopping early,
          # and a crashing target is exactly that.
          timeout --signal=INT "${MINUTES}m" zig build test-fuzz --fuzz 2>&1 | tee search.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          inputs_found=$(find .zig-cache/f -type f 2>/dev/null | wc -l)
          echo "inputs=$inputs_found" >> "$GITHUB_OUTPUT"
          if [ "$status" -ne 124 ] && [ "$status" -ne 0 ]; then
            echo "::error::the search stopped early (exit $status) — see the log and the corpus artifact"
            exit 1
          fi
          echo "searched ${MINUTES}m, corpus holds ${inputs_found} inputs" >> "$GITHUB_STEP_SUMMARY"

      - name: save the corpus
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .zig-cache/f
          key: fuzz-corpus-${{ github.run_id }}

      # The corpus is the finding when something crashes: the input that
      # did it is in there, and `zig build test-fuzz` replays it.
      - name: upload the corpus
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-corpus
          path: |
            .zig-cache/f
            search.log
          if-no-files-found: ignore

      - name: Report
        # This step used to say "no webhook of our own", because
        # `discord.yml` had been dropped for the GitHub->Discord
        # integration the three repositories share and a second poster
        # would double every message. That reasoning does not survive
        # this workflow: the integration reports a run as red or green,
        # and red is what a clean search looks like right up until the
        # commit above this one. The two outcomes worth telling apart —
        # a search that held for its whole box, and a target that
        # stopped early with the input still in the corpus — are exactly
        # what a generic run notification cannot say. So the poster is
        # back, deliberately, and only here.
        #
        # A nightly that speaks only on failure is indistinguishable
        # from a nightly that stopped running, so the clean case posts
        # too. It is one line a day and it is proof of life.
        if: always()
        env:
          OUTCOME: ${{ steps.search.outcome }}
          # The search's real exit code, which is how a crashing target is
          # told from a build that never got there. Empty means the step
          # died before it could record one.
          STATUS: ${{ steps.search.outputs.status }}
          INPUTS: ${{ steps.search.outputs.inputs }}
          MINUTES: ${{ inputs.minutes || '20' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Never interpolated into the script body: `${{ }}` would paste
          # the secret into the command line. It arrives as an
          # environment variable and curl reads it from there.
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          set -euo pipefail
          if [ "$OUTCOME" = success ]; then
            summary=$(printf 'Fuzz search clean\n\nSearched %s minutes with every target holding. Corpus: %s inputs.\n' \
              "$MINUTES" "${INPUTS:-0}")
            message=$(printf ':green_circle: **fuzz-search clean** — searched %s minutes, every target held. Corpus holds %s inputs.' \
              "$MINUTES" "${INPUTS:-0}")
          elif [ -n "${STATUS:-}" ]; then
            # A status was recorded and it was not 0 or 124, so the
            # fuzzer itself stopped early. That is a finding.
            summary=$(printf 'Fuzz search FOUND SOMETHING\n\nA target stopped early (exit %s). The input that did it is in the `fuzz-corpus` artifact; `zig build test-fuzz` replays it.\n' "$STATUS")
            message=$(printf ':red_circle: **fuzz-search FOUND SOMETHING** — a target stopped early (exit %s). The input that did it is in the `fuzz-corpus` artifact; `zig build test-fuzz` replays it.' "$STATUS")
          else
            # No status recorded: the job broke before or during the
            # search rather than because of it. Calling this a finding is
            # how a notification channel teaches people to ignore it.
            summary=$(printf 'Fuzz search did not complete\n\nThe job failed before the search reported a status. This is infrastructure, not a finding.\n')
            message=':yellow_circle: **fuzz-search did not complete** — the job failed before the search reported a status. Infrastructure, not a finding.'
          fi
          printf '%s\n' "$summary" >> "$GITHUB_STEP_SUMMARY"

          # No webhook configured is a valid state — a fork, or a clone
          # that has not been given one. Say so and stop, rather than
          # failing a search that was fine.
          if [ -z "${WEBHOOK:-}" ]; then
            echo "::notice::DISCORD_WEBHOOK is not set; skipping the post"
            exit 0
          fi

          # jq builds the JSON so the message cannot break out of it.
          body=$(jq -nc --arg content "$message"$'\n'"$RUN_URL" '{content: $content}')
          code=$(curl -sS -o /tmp/discord.out -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' \
            --data-binary @- "$WEBHOOK" <<<"$body")

          # A notification channel that fails quietly is worth nothing:
          # you cannot tell it apart from a night with nothing to say.
          # Discord answers 204 with no body on success.
          if [ "$code" != "204" ] && [ "$code" != "200" ]; then
            echo "::error::posting to Discord failed with HTTP $code"
            cat /tmp/discord.out >&2 || true
            exit 1
          fi
          echo "posted to Discord (HTTP $code)"
