name: fuzz-search

# The coverage-guided search, nightly — zoxy's `nightly-sim.yml` shape,
# for the same reason: a search has no natural end, so it belongs on a
# clock rather than in a pull request. `fuzz.yml` is the per-PR gate and
# runs each target once over its seeds; this one lets the fuzzer *steer*.
#
# The corpus is cached between runs and that is the whole point. A
# coverage-guided fuzzer is worth what its corpus is worth, and a run
# that starts from the three inline seeds each morning is a random
# search wearing a fuzzer's name.
on:
  schedule:
    # 04:00 UTC daily, an hour after zoxy's sim so two long jobs do not
    # contend for the same runners.
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long to search"
        required: false
        default: "20"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/zig

      # Restored by prefix so yesterday's corpus seeds today's run; saved
      # under a unique key because the cache is immutable once written.
      - name: restore the corpus
        uses: actions/cache/restore@v4
        with:
          path: .zig-cache/f
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-

      - name: search
        id: search
        env:
          MINUTES: ${{ inputs.minutes || '20' }}
        # Not the default `bash -e`. This step's whole job is to inspect a
        # non-zero status and decide what it means, and `-e` denies it the
        # chance: with `pipefail` on, the timeout's 124 becomes the
        # pipeline's status and `-e` kills the script on that very line —
        # before `PIPESTATUS` is read, before the `if` below forgives it.
        # Every run of this workflow failed that way while the comment
        # underneath correctly called 124 the expected outcome. `set` in
        # the body cannot fix it, because the flag arrives on the command
        # line, so it has to be spelled out here.
        shell: bash --noprofile --norc -uo pipefail {0}
        run: |
          # `--fuzz` runs until interrupted, so the time box is the
          # runner's. 124 is the timeout firing, which is the *expected*
          # end of a search; anything else is the fuzzer stopping early,
          # and a crashing target is exactly that.
          timeout --signal=INT "${MINUTES}m" zig build test-fuzz --fuzz 2>&1 | tee search.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          inputs_found=$(find .zig-cache/f -type f 2>/dev/null | wc -l)
          echo "inputs=$inputs_found" >> "$GITHUB_OUTPUT"
          if [ "$status" -ne 124 ] && [ "$status" -ne 0 ]; then
            echo "::error::the search stopped early (exit $status) — see the log and the corpus artifact"
            exit 1
          fi
          echo "searched ${MINUTES}m, corpus holds ${inputs_found} inputs" >> "$GITHUB_STEP_SUMMARY"

      - name: save the corpus
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .zig-cache/f
          key: fuzz-corpus-${{ github.run_id }}

      # The corpus is the finding when something crashes: the input that
      # did it is in there, and `zig build test-fuzz` replays it.
      - name: upload the corpus
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-corpus
          path: |
            .zig-cache/f
            search.log
          if-no-files-found: ignore

      - name: Report to Discord
        # This step used to say "no webhook of our own", because
        # `discord.yml` had been dropped for the GitHub->Discord
        # integration the three repositories share and a second poster
        # would double every message. That reasoning does not survive
        # this workflow: the integration reports a run as red or green,
        # and red is what a clean search looked like until the commit
        # that taught the step to forgive exit 124. The distinction worth
        # notifying on is not red versus green.
        #
        # Shaped after zoxy's `nightly-sim.yml`, deliberately: the two
        # nightlies land in the same channel, and one that reads
        # differently from the other is one you have to stop and parse.
        #
        # A nightly that speaks only on failure is indistinguishable from
        # a nightly that stopped running, so the clean case posts too.
        if: always()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          OUTCOME: ${{ steps.search.outcome }}
          # The search's real exit code, which is how a crashing target is
          # told from a build that never got there. Empty means the step
          # died before it could record one.
          STATUS: ${{ steps.search.outputs.status }}
          INPUTS: ${{ steps.search.outputs.inputs }}
          MINUTES: ${{ inputs.minutes || '20' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Three outcomes, not two. A plain success/failure split would
          # call a broken runner a discovery, which is how a channel
          # teaches people to ignore it.
          if [ "$OUTCOME" = "success" ]; then
            title="Fuzz search clean"
            color=3066993
            detail=$(printf 'Searched %s minutes with every target holding.' "$MINUTES")
          elif [ -n "${STATUS:-}" ]; then
            # A status was recorded and it was neither 0 nor the time
            # box's 124, so the fuzzer itself stopped early. The input
            # that did it is in the corpus, and the corpus is uploaded.
            title="Fuzz search FOUND SOMETHING"
            color=15158332
            detail=$(printf 'A target stopped early (exit %s). The input that did it is in the `fuzz-corpus` artifact. Replay it:\n```\nzig build test-fuzz\n```' \
              "$STATUS")
          else
            # Distinct from a finding: nothing was proven, but nothing
            # broke either.
            title="Fuzz search did not complete"
            color=9807270
            detail="The job failed before the search reported a status — no verdict, and not a finding."
          fi

          # 124 is the time box firing, which is how a healthy search
          # ends. Printing the bare number in the channel reads as an
          # error code to anyone glancing at it, so the field says what
          # the number means instead.
          if [ "${STATUS:-}" = "124" ]; then
            ended="time box"
          elif [ -z "${STATUS:-}" ]; then
            ended="no status"
          else
            ended=$(printf 'exit %s' "$STATUS")
          fi

          if [ -z "${WEBHOOK:-}" ]; then
            echo "::warning::DISCORD_WEBHOOK is not set; skipping the report."
            printf '%s\n\n%s\n' "$title" "$detail" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # jq builds the payload so an exit code, a count, or a future
          # message can never break out of the JSON.
          jq -n \
            --arg title "$title" \
            --arg detail "$detail" \
            --argjson color "$color" \
            --arg box "${MINUTES:-?}m time box" \
            --arg corpus "${INPUTS:-0} inputs" \
            --arg ended "$ended" \
            --arg sha "${SHA:0:7}" \
            --arg url "$RUN_URL" \
            '{
              username: "zssl fuzz",
              embeds: [{
                title: $title,
                description: $detail,
                color: $color,
                url: $url,
                fields: [
                  {name: "Search", value: $box, inline: true},
                  {name: "Corpus", value: $corpus, inline: true},
                  {name: "Ended", value: $ended, inline: true},
                  {name: "Commit", value: $sha, inline: true}
                ]
              }]
            }' > payload.json
          curl -sS -f -X POST -H "Content-Type: application/json" \
            -d @payload.json "$WEBHOOK" > /dev/null
          echo "Reported: $title"
          printf '%s\n\n%s\n' "$title" "$detail" >> "$GITHUB_STEP_SUMMARY"
