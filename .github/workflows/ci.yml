name: ci

on:
  push:
    branches: [main]
  pull_request:

# A push that lands while an earlier run is still going supersedes it:
# the BoGo job takes minutes and there is no value in finishing a run
# for a commit that is already history.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: 0.16.0
  # The version whose output is verified locally, so CI measures with
  # the same tool rather than whatever an archive happens to carry.
  KCOV_VERSION: v43

jobs:
  # The gates CLAUDE.md names, minus BoGo, which is slow enough to want
  # its own job. ReleaseSafe is run because it is what releases ship and
  # assertions stay on there.
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: format
        run: zig fmt --check src interop bogo tlsfuzzer scripts build.zig build.zig.zon
      - name: test
        run: zig build test
      - name: test (ReleaseSafe)
        run: zig build test -Doptimize=ReleaseSafe
      - name: interop
        # Exit 2 is the gate's own SKIP; ubuntu ships an openssl that
        # speaks 1.3, so it should not fire, and a SKIP is not a failure.
        run: zig build interop || [ $? -eq 2 ]

  # BoringSSL's adversarial runner. Fetches the pinned checkout on first
  # run, so this job is the one that needs network and Go.
  bogo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: bogo
        run: zig build bogo
      - name: upload the runner log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bogo-log
          path: zig-out/bogo/bogo.log
          if-no-files-found: ignore

  # Coverage without a third party: kcov produces the number, CI writes it
  # to an orphan `badges` branch in this repository, and shields.io reads
  # that branch through its endpoint API. The only credential involved is
  # the token GitHub already hands the job.
  coverage:
    # kcov is built from a pinned tag rather than installed from apt,
    # because it is packaged only for jammy — absent from noble onward,
    # and upstream ships no prebuilt binary — and because pinning the
    # version keeps CI on the one whose output gets verified locally.
    #
    # It is *not* here because of a version bug. An earlier commit
    # message blamed kcov 38 for the 0% badge; that was a hypothesis
    # stated as fact, and it was wrong. kcov 43 reported 0% too. The
    # cause was the include pattern in build.zig matching no files on
    # Linux, and that is fixed there.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: cache kcov
        id: kcov-cache
        uses: actions/cache@v4
        with:
          path: ~/kcov-prefix
          key: kcov-${{ env.KCOV_VERSION }}-${{ runner.os }}
      - name: build kcov
        if: steps.kcov-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake binutils-dev libcurl4-openssl-dev \
            zlib1g-dev libdw-dev libiberty-dev
          git clone --depth 1 --branch "$KCOV_VERSION" \
            https://github.com/SimonKagstrom/kcov /tmp/kcov
          cmake -S /tmp/kcov -B /tmp/kcov/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$HOME/kcov-prefix"
          cmake --build /tmp/kcov/build -j"$(nproc)"
          cmake --install /tmp/kcov/build
      - name: put kcov on PATH
        run: |
          echo "$HOME/kcov-prefix/bin" >> "$GITHUB_PATH"
          sudo apt-get install -y libdw1 libcurl4 || true
      - name: coverage
        run: |
          kcov --version
          zig build coverage
          echo "--- what kcov produced ---"
          find zig-out/coverage -maxdepth 3 | head -40
      # The whole report, always — the badge is a summary and this is the
      # thing you actually read when the summary moves.
      - name: upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: zig-out/coverage
          if-no-files-found: ignore
      - name: read the percentage
        id: pct
        run: |
          set -euo pipefail
          # kcov writes one coverage.json per instrumented binary, and may
          # write a merged one beside them. Take the report covering the
          # most lines rather than whichever `find` reaches first — an
          # empty merged report is how this produced a 0% badge once.
          file=$(find zig-out/coverage -name coverage.json -print0 \
            | xargs -0 -I{} sh -c 'printf "%s %s\n" "$(jq -r ".total_lines // 0" {})" {}' \
            | sort -rn | head -1 | cut -d" " -f2-)
          if [ -z "$file" ]; then
            echo "no coverage.json under zig-out/coverage" >&2
            find zig-out/coverage -maxdepth 3 >&2 || true
            exit 1
          fi
          echo "using $file"
          jq -r '{percent_covered, covered_lines, total_lines}' "$file"
          pct=$(jq -r '.percent_covered // empty' "$file")
          # A file that exists with the field renamed would otherwise
          # publish a badge reading "null%", which is worse than no badge.
          case "$pct" in
            ''|*[!0-9.]*)
              echo "no numeric percent_covered in $file" >&2
              jq -r 'keys' "$file" >&2 || cat "$file" >&2
              exit 1
              ;;
          esac
          # Zero is not a measurement. This suite covers ~97% of `src/`
          # when kcov instruments it at all, so 0% means the instrumentation
          # missed — a wrong number that looks like data, which is worse
          # than a red job.
          if awk "BEGIN{exit !($pct == 0)}"; then
            echo "coverage reported 0% — instrumentation did not attach" >&2
            jq -r '{total_lines, covered_lines, files: (.files|length)}' "$file" >&2 || true
            echo "--- every report kcov wrote ---" >&2
            find zig-out/coverage -name coverage.json -exec sh -c \
              'echo "== {}"; jq -r "{percent_covered, total_lines, files:(.files|length)}" {}' \; >&2 || true
            exit 1
          fi
          echo "percent=$pct" >> "$GITHUB_OUTPUT"
          echo "coverage: $pct%"
      # Only on a push to main: a pull request from a fork cannot write
      # here, and a per-PR number would only make the badge flicker.
      - name: publish the badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          PCT: ${{ steps.pct.outputs.percent }}
        run: |
          set -euo pipefail
          # Green above 80, yellow above 60, red below. The thresholds are
          # a reading aid, not a gate — the gates are `test` and `bogo`.
          # `if` rather than `awk ... && colour=`, because under `set -e` a
          # failing test at the head of an `&&` list ends the job.
          colour=red
          if awk "BEGIN{exit !($PCT >= 60)}"; then colour=yellow; fi
          if awk "BEGIN{exit !($PCT >= 80)}"; then colour=brightgreen; fi
          printf '{"schemaVersion":1,"label":"coverage","message":"%.1f%%","color":"%s"}\n' \
            "$PCT" "$colour" > /tmp/coverage.json
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # An orphan branch carrying one file: it shares no history with
          # main, so it cannot be mistaken for a code branch. Clearing the
          # index rather than deleting the worktree — everything else stays
          # untracked and simply never enters the commit, which keeps a
          # stray `rm -rf` out of a job that holds a write token.
          git checkout --orphan badges
          git rm -rf --cached . >/dev/null
          cp /tmp/coverage.json coverage.json
          git add coverage.json
          git commit -m "coverage: $PCT%" --quiet
          git push --force origin badges
