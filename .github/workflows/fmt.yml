name: fmt

# One workflow per check, so each carries its own badge and its own
# result. They share `.github/actions/zig`, which is where the toolchain
# version lives — nine copies of a version string would drift.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/zig
      - name: format
        run: zig fmt --check src interop bench bogo tlsanvil tlsfuzzer scripts build.zig build.zig.zon
