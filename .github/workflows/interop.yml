name: interop

# One workflow per check, so each carries its own badge and its own
# result. They share `.github/actions/zig`, which is where the toolchain
# version lives — nine copies of a version string would drift.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: every gate only reads the tree. Declared rather
# than inherited, so a change to the repository default cannot widen
# it silently.
permissions:
  contents: read

jobs:
  interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/zig
      - name: interop
        # Exit 2 is the gate's own SKIP; ubuntu ships an openssl that
        # speaks 1.3, so it should not fire, and a SKIP is not a failure.
        run: zig build interop || [ $? -eq 2 ]
